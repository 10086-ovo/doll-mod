org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.configuration-cache=false

# FG7 official mechanism: merge classes and resources into a single classpath entry (build/sourceSets/main),
# so that ClasspathLocator can simultaneously discover mods.toml and @Mod classes (fixes "constructed 0 mods").
# Source evidence: MinecraftExtensionImpl.finish() lines 341-349, switch = ForgeGradleProblems.test("net.minecraftforge.gradle.merge-source-sets")
net.minecraftforge.gradle.merge-source-sets=true
