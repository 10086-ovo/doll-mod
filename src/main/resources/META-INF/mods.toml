modLoader="javafml"
loaderVersion="[65,)"
license="All Rights Reserved"
[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="AutoMods"
description='''把模组移植到forge，游戏版本不变'''
[[dependencies.${mod_id}]]
modId="forge"
mandatory=true
versionRange="[${forge_version},)"
ordering="NONE"
side="BOTH"
[[dependencies.${mod_id}]]
modId="minecraft"
mandatory=true
versionRange="[${minecraft_version}]"
ordering="NONE"
side="BOTH"

# 注意：Forge 26.2 的加载栈不消费 [[mixins]]（mods.toml mixins 表是无效语法）。
# mixin 配置经容器 manifest 的 MixinConfigs 属性装载（见 build.gradle writeDevMixinManifest / jar.manifest）。
