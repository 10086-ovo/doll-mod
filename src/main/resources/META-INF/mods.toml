modLoader="javafml"
loaderVersion="[65,)"
license="CC0-1.0"
[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="人没事就好"
displayURL="https://github.com/10086-ovo/doll-mod"
logoFile="assets/doll-mod/icon.png"
description='''一个普普通通的 Minecraft 模组：召唤可命名的人偶，配武器盔甲，用 8 种行为模式指挥它们干活。'''
[[dependencies.${mod_id}]]
modId="forge"
mandatory=true
versionRange="[${forge_version},)"
ordering="NONE"
side="BOTH"
[[dependencies.${mod_id}]]
modId="minecraft"
mandatory=true
versionRange="[${minecraft_version}]"
ordering="NONE"
side="BOTH"

# 注意：Forge 26.2 的加载栈不消费 [[mixins]]（mods.toml mixins 表是无效语法）。
# mixin 配置经容器 manifest 的 MixinConfigs 属性装载（见 build.gradle writeDevMixinManifest / jar.manifest）。
